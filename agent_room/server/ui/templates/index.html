{% extends "base.html" %}
{% block title %}agent-room — tasks{% endblock %}
{% block body %}
<section class="card">
  <h2 style="margin-top:0">New task</h2>
  <form id="new-task" class="col">
    <div class="col">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required placeholder="FizzBuzz" />
    </div>
    <div class="col">
      <label for="description">Description</label>
      <textarea id="description" name="description" required placeholder="Implement FizzBuzz with tests"></textarea>
    </div>
    <div class="row" style="justify-content:flex-end">
      <span id="new-task-status" class="pill"></span>
      <button type="submit">Run</button>
    </div>
  </form>
</section>

<section class="card">
  <h2 style="margin-top:0">Recent tasks</h2>
  <p style="color:var(--muted); margin-top:0">
    The server is task-rooted (no session list). Open a task by id below or start
    a new one above; the URL of any running task is shareable.
  </p>
  <form id="open-task" class="row">
    <input type="text" id="task-id" name="task-id" placeholder="task-..." style="flex:1"/>
    <button type="submit">Open</button>
  </form>
</section>
<script>window.AGENT_ROOM_PAGE = "index";</script>
{% endblock %}

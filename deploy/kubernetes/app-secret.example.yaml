# Copy to app-secret.yaml, replace every value, and apply outside source control.
apiVersion: v1
kind: Secret
metadata:
  name: agent-room-secrets
  namespace: agent-room
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@POSTGRES_HOST:5432/agent_room?sslmode=require
  RABBITMQ_URL: amqps://USER:PASSWORD@RABBITMQ_HOST:5671/VHOST
  GATEWAY_API_KEY: replace-with-a-long-random-service-key
  OPENAI_API_KEY: replace-with-provider-key
  # Required only when AGENT_ROOM_SANDBOX_RUNNER_URL is configured.
  AGENT_ROOM_SANDBOX_RUNNER_TOKEN: replace-with-a-separate-runner-token

apiVersion: v1
kind: Service
metadata:
  name: agent-room-gateway
  namespace: agent-room
spec:
  selector:
    app.kubernetes.io/name: agent-room-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-room-gateway
  namespace: agent-room
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-room-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-room-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/agent-room-gateway:REPLACE_WITH_IMMUTABLE_TAG
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: agent-room-config }
            - secretRef: { name: agent-room-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-room-gateway
  namespace: agent-room
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-room-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-room-gateway
  namespace: agent-room
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-room-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
